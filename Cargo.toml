[workspace]
resolver = "3"
members = ["crates/kelpie", "crates/kelpie-cli"]

[workspace.package]
version = "0.1.18"
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["yumazak"]

[workspace.dependencies]
tokio = { version = "1", features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
strip = "symbols"
