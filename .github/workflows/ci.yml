name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      # No `web/dist` here on purpose: without it the crate just serves the API.

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/kelpie/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: crates/kelpie/web/pnpm-lock.yaml

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      - name: lint
        run: pnpm lint

      - name: knip
        run: pnpm knip

      - name: build
        run: pnpm build

      # `build` regenerates the route tree, so a diff here means it was stale.
      - name: routeTree.gen.ts is current
        working-directory: .
        run: git diff --exit-code -- crates/kelpie/web/src/routeTree.gen.ts
